name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  SECRET_KEY: "ci-secret-key"
  DJANGO_SETTINGS_MODULE: "config.settings.test"
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/wms_saep_test"

jobs:
  ruff-format:
    name: ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .

  ruff-check:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run mypy apps

  css-build:
    name: css build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: make css-build
      - name: verificar app.css versionado
        run: |
          if ! git diff --exit-code --stat -- apps/core/static/core/css/app.css; then
            echo "::error file=apps/core/static/core/css/app.css::app.css versionado diverge do build limpo. Rode 'make css-build' e commite o resultado."
            exit 1
          fi

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    needs: [ruff-format, ruff-check, mypy]
    env:
      DEBUG: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_saep_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_saep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python manage.py makemigrations
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate --run-syncdb
      - run: SEED_DEV_HABILITADO=true uv run python manage.py seed_dev
      - run: SEED_DEV_HABILITADO=true uv run python manage.py seed_dev

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    needs: [ruff-format, ruff-check, mypy]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_saep_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_saep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python manage.py makemigrations
      - run: uv run pytest -q -ra --tb=short --strict-markers --disable-warnings -n logical -m "not navegador"

  # Camada Navegador (ADR-0019). Depende de `pytest`, e não dos gates de
  # qualidade: teste de navegador só informa alguma coisa se a suíte de unidade
  # já está verde, e boot de navegador sobre suíte vermelha é minuto queimado sem
  # sinal. Sem `-n`: a camada é pequena por desenho e paralelizá-la só
  # multiplicaria instâncias de navegador.
  navegador:
    name: navegador
    runs-on: ubuntu-latest
    needs: [pytest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_saep_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_saep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run python manage.py makemigrations
      - run: uv run pytest -q -ra --tb=short --strict-markers --disable-warnings -m navegador
