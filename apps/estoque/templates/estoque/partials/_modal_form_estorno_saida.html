{% comment %}
  Corpo do form do modal de estorno de saída excepcional — só o campo de
  justificativa (obrigatório). Usado via form_body_template em
  components/modal.html (issue #78).
{% endcomment %}

<div>
  <label for="justificativa" class="block text-sm font-medium text-text-secondary">
    Justificativa <span class="text-danger-accent" aria-hidden="true">*</span>
  </label>
  <textarea
    id="justificativa"
    name="justificativa"
    required
    rows="3"
    class="campo mt-1"
    placeholder="Descreva o motivo do estorno…"
  ></textarea>
</div>
