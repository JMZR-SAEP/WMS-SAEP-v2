{% comment %}
  Item de resultado do autocomplete de beneficiário: nome + matrícula + setor.
  Incluído por `components/autocomplete.html` dentro do escopo Alpine `item`/`idx`.
{% endcomment %}
<span class="font-medium text-text-primary" x-text="item.nome"></span>
<span class="ml-1 text-xs text-text-tertiary" x-text="'(' + item.matricula + ')'"></span>
<span x-show="item.setor" class="ml-1 text-xs text-text-disabled" x-text="'· ' + item.setor"></span>
