{% if cancelamento_requer_justificativa %}
  <label for="modal-cancelar-justificativa" class="block text-sm font-medium text-text-primary">
    Justificativa do cancelamento <span aria-hidden="true" class="text-danger-accent">*</span>
  </label>
  <p id="modal-cancelar-hint" class="mt-1 text-xs text-text-secondary">
    Obrigatória para requisições autorizadas ou prontas para retirada.
  </p>
  <textarea
    id="modal-cancelar-justificativa"
    name="justificativa"
    rows="4"
    aria-required="true"
    aria-describedby="modal-cancelar-hint{% if erro %} {{ id }}-erro{% endif %}"
    {% if erro %}aria-invalid="true"{% endif %}
    class="mt-3 block w-full rounded-lg border border-border-strong bg-surface px-3 py-2 text-sm text-text-primary shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-danger-accent focus-visible:ring-offset-1"
  >{{ justificativa_cancelamento|default_if_none:"" }}</textarea>
{% else %}
  <p class="rounded-lg border border-border bg-bg-page px-3 py-2.5 text-sm text-text-secondary">
    Confirme para continuar. Use <span class="font-semibold">Voltar</span> se quiser manter a requisição aberta.
  </p>
{% endif %}
